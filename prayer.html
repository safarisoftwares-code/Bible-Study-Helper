<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🙏 Prayer Warriors — Bible Study Helper</title>
<style>
  :root { --bg:#f4f7f4; --card:#fff; --text:#1e2f2e; --green:#3d9970; --green-hover:#34a870; --border:#e2ede4; }
  .dark-mode { --bg:#1a2520; --card:#25332b; --text:#dfe8e0; --border:#3b5143; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg); color: var(--text);
    padding: 24px 20px; line-height: 1.6;
    min-height: 100vh; display: flex; flex-direction: column;
  }
  .container { max-width: 700px; margin: 0 auto; flex: 1; display: flex; flex-direction: column; justify-content: center; }
  .card { background: var(--card); border-radius: 24px; padding: 44px 32px; box-shadow: 0 8px 24px rgba(0,0,0,0.08); border: 1px solid var(--border); text-align: center; }
  .emoji { font-size: 3rem; margin-bottom: 12px; }
  h1 { color: var(--green); margin-bottom: 16px; font-size: 1.9rem; font-weight: 700; }
  p { margin-bottom: 14px; opacity: 0.88; font-size: 1.02rem; }
  .coming-soon { display: inline-block; background: #fff4d6; color: #8a6d00; padding: 6px 16px; border-radius: 20px; font-size: 0.85rem; font-weight: 700; margin-bottom: 20px; letter-spacing: 0.02em; }
  .btn { display: inline-block; padding: 14px 28px; background: var(--green); color: #fff; text-decoration: none; border-radius: 10px; font-weight: 700; margin-top: 10px; transition: 0.15s; box-shadow: 0 3px 10px rgba(61,153,112,0.25); }
  .btn:hover { background: var(--green-hover); transform: translateY(-2px); box-shadow: 0 6px 16px rgba(61,153,112,0.35); }
</style>
</head>
<body>
<div class="container">
  <div class="card">
    <div class="emoji">🙏</div>
    <h1>Prayer Warriors</h1>
    <div class="coming-soon">COMING SOON</div>
    <p>Intercessors of Scripture — Abraham, Moses, Hannah, Daniel, Paul, Epaphras.</p>
    <p>This page is being prepared with the same care as Women of Faith.</p>
    <a href="index.html" class="btn">← Back to Study Helper</a>
  </div>
</div>
</body>
</html>
